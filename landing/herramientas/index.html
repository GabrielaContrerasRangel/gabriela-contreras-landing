<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUSEMAP — Herramientas · Gabriela Contreras</title>
<meta name="description" content="MUSEMAP — tu biblioteca de recursos de IA y asistente creativo. Una herramienta de Gabriela Contreras." />
<meta property="og:title" content="MUSEMAP — Herramientas · Gabriela Contreras" />
<meta property="og:description" content="Tu biblioteca de recursos de IA y asistente creativo." />
<meta property="og:image" content="../og.svg" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%238c1e37'/><text x='50' y='68' font-size='54' font-family='sans-serif' font-weight='700' fill='%23f5f1ea' text-anchor='middle'>GC</text></svg>" />
<style>
  html, body { margin: 0; padding: 0; }
  /* mini barra de retorno, en la voz visual del sitio */
  #gc-backbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 18px;
    background: rgba(26,26,26,.55); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(245,241,234,.12);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #gc-backbar a { color: #f5f1ea; text-decoration: none; font-size: 14px; opacity: .85; transition: opacity .2s; }
  #gc-backbar a:hover { opacity: 1; }
  #gc-backbar .gc-home { display: flex; align-items: center; gap: 7px; font-weight: 500; }
  #gc-backbar .gc-home .mk { color: #d4607c; font-weight: 700; letter-spacing: -0.05em; }
  #root { padding-top: 44px; }
</style>
</head>
<body>
  <div id="gc-backbar">
    <a class="gc-home" href="/"><span>&larr;</span> <span class="mk">GC</span> Gabriela Contreras</a>
    <a href="/#servicios">Servicios</a>
  </div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    // Shim de almacenamiento: el componente espera window.storage (API del sandbox).
    // Lo respaldamos con localStorage para que la biblioteca persista en producción.
    if (!window.storage) {
      window.storage = {
        get: async (k) => { const v = localStorage.getItem(k); return v === null ? null : { value: v }; },
        set: async (k, v) => { localStorage.setItem(k, v); },
        delete: async (k) => { localStorage.removeItem(k); },
      };
    }
  </script>
  <script src="/herramientas/musemap.js"></script>
</body>
</html>
